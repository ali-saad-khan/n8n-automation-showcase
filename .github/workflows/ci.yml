name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Static validation of workflow JSON
        run: node scripts/validate.mjs
      - name: Build static demo
        run: npm run build:demo
