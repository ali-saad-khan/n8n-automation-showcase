<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>n8n Workflow Showcase</title>
  <meta name="description" content="Interactive viewer for six importable n8n workflows: pagination, authenticated webhooks, error alerts and retries, AI classification and AI agents with tools.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='8' r='2.5' fill='%23ea4b71'/%3E%3Ccircle cx='12' cy='4' r='2.5' fill='%23ea4b71'/%3E%3Ccircle cx='12' cy='12' r='2.5' fill='%23ea4b71'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <a class="skip" href="#main">Skip to workflow</a>
  <header class="top">
    <h1>n8n Workflow Showcase</h1>
    <p class="sub">Five showcase workflows plus a helper sub-workflow by Saad Ali Khan. Graphs are rendered from the exported JSON.</p>
    <button type="button" id="theme" class="btn" aria-label="Toggle light or dark theme">Theme</button>
  </header>
  <div class="layout">
    <nav class="side" aria-label="Workflows">
      <h2 class="side-h">Workflows</h2>
      <ul id="list" class="list"></ul>
    </nav>
    <main id="main" class="main" tabindex="-1">
      <noscript><p>This viewer needs JavaScript to draw the graphs. The raw workflow JSON is in the <code>workflows/</code> folder.</p></noscript>
      <article id="detail" aria-live="polite"></article>
    </main>
  </div>
  <script src="workflows-data.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
